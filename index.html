<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luyện Nói Phỏng Vấn N5 (Có Từ Khóa & Âm Thanh) - Trần Thị Ngọc Hà</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --primary-light: #e0e7ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --accent: #d97706;
      --accent-bg: #fef3c7;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 12px;
      line-height: 1.5;
    }

    .card {
      max-width: 700px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
      padding: 16px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 4px;
    }

    p.sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 12px;
    }

    .select-box {
      width: 100%;
      padding: 11px 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border: 2px solid var(--primary);
      border-radius: 10px;
      background-color: #fff;
      color: var(--text-main);
      outline: none;
      margin-bottom: 12px;
      cursor: pointer;
    }

    /* KEYWORD BOX CỰC KỲ NỔI BẬT */
    .keyword-panel {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .kw-row {
      margin-bottom: 10px;
    }
    .kw-row:last-child {
      margin-bottom: 0;
    }

    .kw-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .kw-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .kw-listen {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .kw-speak {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .kw-text {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.4;
      padding: 6px 10px;
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .kw-tip {
      font-size: 0.75rem;
      color: #b45309;
      margin-top: 3px;
      font-style: italic;
    }

    /* CONTROLS */
    .control-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .play-all-btn {
      flex: 1;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .play-all-btn:active {
      transform: scale(0.98);
    }

    .speed-select {
      width: 100px;
      padding: 0 8px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #fff;
      outline: none;
    }

    .sentence-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .s-item {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .s-item:active {
      transform: scale(0.99);
      background: #e2e8f0;
    }

    .s-item.playing {
      background: #e0e7ff;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.3);
    }

    .s-item.question-box {
      background: #fffbeb;
      border-left: 4px solid var(--accent);
    }

    .s-num {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #cbd5e1;
      color: #334155;
      font-size: 0.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .playing .s-num {
      background: var(--primary);
      color: #fff;
    }

    .s-content {
      flex-grow: 1;
      min-width: 0;
    }

    .s-ja {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
      margin-bottom: 2px;
    }

    .s-romaji {
      font-size: 0.78rem;
      color: var(--primary-dark);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .s-vi {
      font-size: 0.82rem;
      color: #334155;
      line-height: 1.35;
    }

    .s-play-icon {
      flex-shrink: 0;
      font-size: 1.1rem;
      color: var(--primary);
      margin-top: 2px;
      padding: 2px 4px;
    }

    .prep-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .tag-prep-p { background: #dbeafe; color: #1e40af; }
    .tag-prep-r { background: #fef3c7; color: #92400e; }
    .tag-prep-e { background: #dcfce7; color: #166534; }
    .tag-q { background: #fee2e2; color: #991b1b; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      font-size: 0.82rem;
      padding: 8px 18px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Luyện Nói Phỏng Vấn N5 Thực Chiến</h1>
    <p class="sub">Trần Thị Ngọc Hà • Đầy đủ Keyword Tai Nghe & Miệng Nói • Chuẩn PREP N5</p>

    <!-- SELECT CHỌN BÀI -->
    <select class="select-box" id="sec-select" onchange="switchSection(this.value)">
      <optgroup label="🟢 PHẦN A: 10 CÂU HỎI CỐT LÕI (CHUNG 3 CÔNG TY)">
        <option value="c1">Câu 1: Giới thiệu bản thân (自己紹介)</option>
        <option value="c2">Câu 2: Kỹ năng & 119 Unit Tests (技術スキル)</option>
        <option value="c3">Câu 3: Điểm mạnh - Zero Bug (自己PR)</option>
        <option value="c4">Câu 4: Điểm yếu - Hay lo lắng (短所)</option>
        <option value="c5">Câu 5: Làm việc nhóm - Horenso (チームワーク)</option>

        <option value="technolabo">🏢 TechnoLabo: 4 Câu hỏi & Trả lời (Xe hơi & Test)</option>
        <option value="hdk">🏭 Hokkaido Denshikiki: 4 Câu hỏi & Trả lời (Hạ tầng & C/C++)</option>
        <option value="ryuken">💻 Ryuken: 4 Câu hỏi & Trả lời (Goushou & Java)</option>
      </optgroup>
    </select>

    <!-- HỘP HIỂN THỊ TỪ KHÓA KEYWORD (TAI NGHE & MIỆNG NÓI) -->
    <div class="keyword-panel" id="keyword-panel">
      <div class="kw-row">
        <div class="kw-header">
          <span class="kw-badge kw-listen">🎧 KEYWORD CÂU HỎI (TAI NGHE)</span>
        </div>
        <div class="kw-text" id="kw-q-text">Đang tải từ khóa...</div>
        <div class="kw-tip" id="kw-q-tip"></div>
      </div>
      <div class="kw-row" style="margin-top: 8px;">
        <div class="kw-header">
          <span class="kw-badge kw-speak">🗣️ KEYWORD TRẢ LỜI (MIỆNG NÓI)</span>
        </div>
        <div class="kw-text" id="kw-a-text">Đang tải từ khóa...</div>
      </div>
    </div>

    <!-- THANH ĐIỀU KHIỂN ÂM THANH -->
    <div class="control-bar">
      <button class="play-all-btn" id="play-all-btn" onclick="togglePlayAll()">
        ▶ Nghe Toàn Bộ Phần Này
      </button>
      <select class="speed-select" id="speed-select" onchange="changeSpeed(this.value)">
        <option value="0.8">Tốc độ: Chậm (0.8x)</option>
        <option value="0.9" selected>Tốc độ: Vừa (0.9x)</option>
        <option value="1.0">Tốc độ: Chuẩn (1.0x)</option>
      </select>
    </div>

    <!-- DANH SÁCH CÂU ĐƠN -->
    <div class="sentence-list" id="sentence-container"></div>
  </div>

  <div class="toast" id="toast"></div>

        { tag: "tag-prep-p", tagText: "[P] Ý CHÍNH", ja: "私は、みんなの役に立つWebやシステムを作りたいです。", romaji: "Watashi wa, minna no yaku ni tatsu Webu ya shisutemu wo tsukuritai desu.", vi: "[P] Em muốn làm Web và hệ thống có ích cho mọi người." },
        { tag: "tag-prep-r", tagText: "[R] LÝ DO", ja: "流研は50年も、良いシステムを作っています。", romaji: "Ryuken wa gojuu-nen mo, yoi shisutemu wo tsukutte imasu.", vi: "[R] Ryuken suốt 50 năm qua luôn làm hệ thống tốt." },
        { tag: "tag-prep-e", tagText: "[E] THỰC TẬP", ja: "私はインターンで、JavaとWebを作りました。", romaji: "Watashi wa intaan de, Java to Webu wo tsukurimashita.", vi: "[E] Khi đi thực tập em đã làm Java và Web." },
        { tag: "tag-prep-e", tagText: "[E] KHÔNG BUG", ja: "バグは発生しませんでした。", romaji: "Bagu wa hassei shimasen deshita.", vi: "[E] Phần em làm không hề phát sinh bug nào." },

        { tag: "tag-prep-p", tagText: "[P] Ý CHÍNH", ja: "はい、ホームページを見ました。", romaji: "Hai, hoomupeeji wo mimashita.", vi: "[P] Vâng, em đã xem trang web của công ty." },

        { isQ: true, tag: "tag-q", tagText: "CÂU HỎI 4", ja: "面接官：何か質問がありますか？", romaji: "Nanika shitsumon ga arimasu ka?", vi: "Người hỏi: Em có câu hỏi gì không?" },
        { tag: "tag-prep-p", tagText: "XIN PHÉP", ja: "はい、1つ質問があります。", romaji: "Hai, hitotsu shitsumon ga arimasu.", vi: "Vâng, em có 1 câu hỏi ạ." },
        { tag: "tag-prep-e", tagText: "CÂU HỎI NGƯỢC", ja: "お客さんに喜んでもらうために、プログラマーは何が大切ですか？", romaji: "Okyaku-san ni yorokonde morau tame ni, puroguramaa wa nani ga taisetsu desu ka?", vi: "Để khách hàng vui mừng, lập trình viên cần điều gì nhất ạ?" }
      ]
    };

    let curSec = 'c1';
    let speechRate = 0.9;
    let jaVoice = null;
    let isPlayingAll = false;
    let playingIdx = -1;
    const audioFallback = new Audio();

    // Khởi tạo giọng đọc tiếng Nhật
    function loadVoices() {
      if ('speechSynthesis' in window) {
        const vList = window.speechSynthesis.getVoices();
        jaVoice = vList.find(v => v.lang === 'ja-JP' || v.lang === 'ja_JP' || v.lang.toLowerCase().includes('ja')) || null;
      }
    }
    loadVoices();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function changeSpeed(val) {
      speechRate = parseFloat(val) || 0.9;
      showToast('Đã đổi tốc độ đọc: ' + val + 'x');
    }

    function cleanTextForSpeech(text) {
      return text.replace(/面接官：/g, '').replace(/[「」『』・]/g, ' ').trim();
    }

    // HỆ THỐNG PHÁT ÂM AN TOÀN TRÊN TẤT CẢ THIẾT BỊ (MOBILE + PC)
    function playAudio(text, onEnded) {
      const clean = cleanTextForSpeech(text);
      let isDone = false;
      const finish = () => {
        if (!isDone) {
          isDone = true;
          if (onEnded) onEnded();
        }
      };

      // Phương án 1: Trình đọc Web Speech API
      if ('speechSynthesis' in window) {
        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          window.speechSynthesis.cancel();

          const u = new SpeechSynthesisUtterance(clean);
          u.lang = 'ja-JP';
          u.rate = speechRate;
          u.pitch = 1.05;
          if (jaVoice) u.voice = jaVoice;

          u.onend = finish;
          u.onerror = (e) => {
            console.warn('SpeechSynthesis error, falling back to TTS stream...', e);
            playAudioFallback(clean, finish);
          };

          // Hẹn giờ tối đa 5s tránh bị treo trên mobile
          setTimeout(() => {
            if (!isDone && window.speechSynthesis.speaking) {
              window.speechSynthesis.cancel();
              finish();
            }
          }, 5500);

          window.speechSynthesis.speak(u);
          return;
        } catch (err) {
          console.warn('SpeechSynthesis init failed:', err);
        }
      }

      // Phương án 2: Dự phòng qua Audio TTS
      playAudioFallback(clean, finish);
    }

    function playAudioFallback(text, finish) {
      try {
        const enc = encodeURIComponent(text);
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&client=tw-ob&q=${enc}`;
        audioFallback.src = url;
        audioFallback.playbackRate = speechRate;
        audioFallback.onended = finish;
        audioFallback.onerror = finish;
        audioFallback.play().catch(e => {
          console.warn('Audio play failed:', e);
          finish();
        });
      } catch (err) {
        finish();
      }
    }

    // HIỂN THỊ TỪ KHÓA & DANH SÁCH CÂU
    function renderSection() {
      // 1. Cập nhật Hộp Từ Khóa
      const meta = SECTIONS_META[curSec] || {
        kwQ: "Đang cập nhật...",
        kwQTip: "",
        kwA: "Đang cập nhật..."
      };
      document.getElementById('kw-q-text').innerText = meta.kwQ;
      document.getElementById('kw-q-tip').innerText = meta.kwQTip || "";
      document.getElementById('kw-a-text').innerText = meta.kwA;

      // 2. Cập nhật Danh sách câu
      const cont = document.getElementById('sentence-container');
      cont.innerHTML = '';
      const list = SECTIONS[curSec] || [];

      list.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `s-item ${item.isQ ? 'question-box' : ''}`;
        div.id = `s-item-${idx}`;
        div.onclick = () => playSingle(idx);

        div.innerHTML = `
          <div class="s-num">${idx + 1}</div>
          <div class="s-content">
            <span class="prep-tag ${item.tag}">${item.tagText}</span>
            <div class="s-ja">${item.ja}</div>
            <div class="s-romaji">${item.romaji}</div>
            <div class="s-vi">${item.vi}</div>
          </div>
          <div class="s-play-icon" title="Bấm để nghe">🔊</div>
        `;
        cont.appendChild(div);
      });
    }

    function playSingle(idx) {
      if (isPlayingAll) stopPlayAll();

      const list = SECTIONS[curSec] || [];
      if (!list[idx]) return;

      document.querySelectorAll('.s-item').forEach(el => el.classList.remove('playing'));
      const curEl = document.getElementById(`s-item-${idx}`);
      if (curEl) curEl.classList.add('playing');
      playingIdx = idx;

      playAudio(list[idx].ja, () => {
        if (curEl) curEl.classList.remove('playing');
        playingIdx = -1;
      });
    }

    function togglePlayAll() {
      if (isPlayingAll) {
        stopPlayAll();
      } else {
        startPlayAll();
      }
    }

    function stopPlayAll() {
      isPlayingAll = false;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      audioFallback.pause();
      document.getElementById('play-all-btn').innerText = '▶ Nghe Toàn Bộ Phần Này';
      document.querySelectorAll('.s-item').forEach(el => el.classList.remove('playing'));
    }

    async function startPlayAll() {
      isPlayingAll = true;
      const btn = document.getElementById('play-all-btn');
      btn.innerText = '⏹ Dừng Lại';
      const list = SECTIONS[curSec] || [];

      for (let i = 0; i < list.length; i++) {
        if (!isPlayingAll) break;
        document.querySelectorAll('.s-item').forEach(el => el.classList.remove('playing'));
        const curEl = document.getElementById(`s-item-${i}`);
        if (curEl) {
          curEl.classList.add('playing');
          curEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        await new Promise(resolve => {
          playAudio(list[i].ja, () => {
            setTimeout(resolve, 600); // nghỉ 0.6s giữa các câu
          });
        });
      }

      stopPlayAll();
      showToast('Đã đọc xong phần này!');
    }

    function switchSection(secKey) {
      stopPlayAll();
      curSec = secKey;
      renderSection();
    }

    // Khởi chạy ban đầu
    renderSection();
  </script>
