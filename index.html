<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Luyện Nói Phỏng Vấn N5 (Câu Đơn Thuần Túy) - Trần Thị Ngọc Hà</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #e0e7ff;
      --dark: #0f172a;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      background: var(--bg);
      color: var(--dark);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 580px;
      background: #fff;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 900;
      color: #1e1b4b;
      text-align: center;
      margin-bottom: 2px;
    }
    p.sub {
      font-size: 0.78rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 12px;
    }
    .select-box {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      font-size: 0.88rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .select-box:focus {
      border-color: #4f46e5;
      background: #fff;
    }
    .group-label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: #6366f1;
    }
    .play-all-btn {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #ec4899);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      margin-bottom: 14px;
      transition: transform 0.15s;
    }
    .play-all-btn:active { transform: scale(0.97); }
    .sentence-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sentence-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: all 0.2s;
    }
    .sentence-item.is-question {
      background: #f1f5f9;
      border-left: 4px solid #6366f1;
    }
    .sentence-item.speaking {
      border-color: #4f46e5;
      background: #eef2ff;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
    }
    .badge-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .tag-prep-p { background: #fee2e2; color: #991b1b; }
    .tag-prep-r { background: #fef3c7; color: #92400e; }
    .tag-prep-e { background: #dcfce7; color: #166534; }
    .tag-q { background: #e0e7ff; color: #3730a3; }
    .ja-text {
      font-size: 0.98rem;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.4;
    }
    .romaji-text {
      font-size: 0.75rem;
      color: #6366f1;
      font-weight: 600;
      margin-top: 2px;
    }
    .vi-text {
      font-size: 0.76rem;
      color: #64748b;
      margin-top: 1px;
    }
    .audio-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #4f46e5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .audio-btn:active { transform: scale(0.9); background: #4f46e5; color: #fff; }
    .toast {
      position: fixed;
      bottom: 20px;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 99;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Luyện Nói Phỏng Vấn N5 (Câu Đơn)</h1>
    <p class="sub">Trần Thị Ngọc Hà • 100% Câu Đơn Ngắn • Chuẩn PREP</p>

    <div class="group-label">Chọn phần luyện tập:</div>
    <select class="select-box" id="sec-select" onchange="switchSection(this.value)">
      <optgroup label="🟢 PHẦN DÙNG CHUNG CẢ 3 CÔNG TY">

        <option value="c3">Câu 3: Kỹ năng & 119 Unit Tests (技術スキル)</option>
        <option value="c4">Câu 4: Điểm mạnh - Cẩn thận (自己PR)</option>
        <option value="c5">Câu 5: Điểm yếu - Hay lo lắng (短所)</option>
        <option value="c6">Câu 6: Làm việc nhóm - Horenso (チームワーク)</option>
        <option value="c8">Câu 8: Xử lý lỗi khó (課題解決)</option>
        <option value="c9">Câu 9: Khi bị nhắc nhở - Cầu tiến (素直さ)</option>
        <option value="c10">Câu 10: Tăng ca & Cuộc sống Nhật (日本生活・残業)</option>
      </optgroup>
      <optgroup label="🔴 PHẦN RIÊNG TỪNG CÔNG TY (CÂU ĐƠN)">
        <option value="technolabo">🏢 TechnoLabo: 4 Câu hỏi & Trả lời (Xe hơi & Test)</option>
        <option value="hdk">🏭 Hokkaido Denshikiki: 4 Câu hỏi & Trả lời (Hạ tầng & C/C++)</option>
        <option value="ryuken">💻 Ryuken: 4 Câu hỏi & Trả lời (Goushou & Java)</option>
      </optgroup>
    </select>

    <button class="play-all-btn" id="play-all-btn" onclick="playAllCurrent()">
      ▶ Nghe Toàn Bộ Phần Này
    </button>

    <div class="sentence-list" id="sentence-container"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>

        { tag: "tag-prep-e", tagText: "[E] KHÔNG LỖI", ja: "エラーはありませんでした。", romaji: "Eraa wa arimasen deshita.", vi: "[E] Không hề có lỗi nào." },

    let curSec = 'c1';
    const audioPlayer = new Audio();
    let voices = [];
    let jaVoice = null;

    function initVoices() {
      if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        jaVoice = voices.find(v => v.lang === 'ja-JP' || v.lang === 'ja_JP' || v.lang.startsWith('ja')) || null;
      }
    }
    if ('speechSynthesis' in window) {
      initVoices();
      window.speechSynthesis.onvoiceschanged = initVoices;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function speakText(text, onEnd = null) {
      showToast("🔊 Đang đọc: " + text.slice(0, 25));
      try {
        const clean = text.replace(/[\n\r]/g, ' ').replace(/^面接官：/, '').trim();
        const url = "https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&client=tw-ob&q=" + encodeURIComponent(clean);
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        audioPlayer.onended = () => { if (onEnd) onEnd(); };
        audioPlayer.onerror = () => fallbackSpeech(clean, onEnd);
        audioPlayer.src = url;
        audioPlayer.play().catch(() => fallbackSpeech(clean, onEnd));
      } catch (e) {
        fallbackSpeech(text, onEnd);
      }
    }

    function fallbackSpeech(text, onEnd = null) {
      if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
        if (onEnd) onEnd();
        return;
      }
      try {
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
        const clean = text.replace(/^面接官：/, '');
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = 'ja-JP';
        u.rate = 0.95;
        if (!jaVoice) initVoices();
        if (jaVoice) u.voice = jaVoice;
        u.onend = () => { if (onEnd) onEnd(); };
        u.onerror = () => { if (onEnd) onEnd(); };
        window.speechSynthesis.speak(u);
      } catch (e) {
        if (onEnd) onEnd();
      }
    }

    function switchSection(secKey) {
      curSec = secKey;
      document.getElementById('sec-select').value = secKey;
      renderList();
    }

    function renderList() {
      const list = SECTIONS[curSec] || [];
      const c = document.getElementById('sentence-container');
      c.innerHTML = list.map((item, idx) => `
        <div class="sentence-item ${item.isQ ? 'is-question' : ''}" id="item-${idx}">
          <div>
            ${item.tag ? `<span class="badge-tag ${item.tag}">${item.tagText}</span>` : ''}
            <div class="ja-text">${item.ja}</div>
            <div class="romaji-text">${item.romaji}</div>
            <div class="vi-text">${item.vi}</div>
          </div>
          <button class="audio-btn" onclick="playSingleSentence(${idx})">🔊</button>
        </div>
      `).join('');
    }

    function playSingleSentence(idx) {
      document.querySelectorAll('.sentence-item').forEach(el => el.classList.remove('speaking'));
      const itemEl = document.getElementById('item-' + idx);
      if (itemEl) itemEl.classList.add('speaking');
      speakText(SECTIONS[curSec][idx].ja, () => {
        if (itemEl) itemEl.classList.remove('speaking');
      });
    }

    function playAllCurrent(idx = 0) {
      const list = SECTIONS[curSec] || [];
      if (idx >= list.length) {
        document.querySelectorAll('.sentence-item').forEach(el => el.classList.remove('speaking'));
        showToast("✅ Đã đọc xong phần này!");
        return;
      }
      document.querySelectorAll('.sentence-item').forEach(el => el.classList.remove('speaking'));
      const itemEl = document.getElementById('item-' + idx);
      if (itemEl) itemEl.classList.add('speaking');
      speakText(list[idx].ja, () => {
        setTimeout(() => playAllCurrent(idx + 1), 380);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderList();
    });
  </script>
