<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Luyện Nói Phỏng Vấn N5 (Chuẩn Từ Vựng: Bagu & Hassei) - Trần Thị Ngọc Hà</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --accent: #d97706;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 12px;
      line-height: 1.5;
    }

    .card {
      max-width: 680px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
      padding: 16px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 4px;
    }

    p.sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 14px;
    }

    .group-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin: 10px 0 4px 2px;
    }

    .select-box {
      width: 100%;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 2px solid var(--primary);
      border-radius: 10px;
      background-color: #fff;
      color: var(--text-main);
      outline: none;
      margin-bottom: 12px;
    }

    .play-all-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      margin-bottom: 16px;
    }

    .play-all-btn:active {
      transform: scale(0.98);
    }

    .sentence-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .s-item {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .s-item:active {
      background: #e2e8f0;
    }

    .s-item.playing {
      background: #e0e7ff;
      border-color: var(--primary);
    }

    .s-item.question-box {
      background: #fffbeb;
      border-left: 4px solid var(--accent);
    }

    .s-num {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #cbd5e1;
      color: #334155;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .playing .s-num {
      background: var(--primary);
      color: #fff;
    }

    .s-content {
      flex-grow: 1;
      min-width: 0;
    }

    .s-ja {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
      margin-bottom: 2px;
    }

    .s-romaji {
      font-size: 0.78rem;
      color: var(--primary-dark);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .s-vi {
      font-size: 0.82rem;
      color: #334155;
      line-height: 1.35;
    }

    .prep-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .tag-prep-p { background: #dbeafe; color: #1e40af; }
    .tag-prep-r { background: #fef3c7; color: #92400e; }
    .tag-prep-e { background: #dcfce7; color: #166534; }
    .tag-q { background: #fee2e2; color: #991b1b; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      font-size: 0.8rem;
      padding: 8px 16px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Luyện Nói Phỏng Vấn N5 (Câu Đơn)</h1>
    <p class="sub">Trần Thị Ngọc Hà • 100% Câu Đơn Ngắn • Chuẩn PREP • Bagu & Hassei</p>

    <div class="group-label">Chọn phần luyện tập:</div>
    <select class="select-box" id="sec-select" onchange="switchSection(this.value)">
      <optgroup label="🟢 PHẦN DÙNG CHUNG CẢ 3 CÔNG TY">
        <option value="c1">Câu 1: Giới thiệu bản thân (自己紹介)</option>
        <option value="c3">Câu 3: Kỹ năng & 119 Unit Tests (技術スキル)</option>
        <option value="c4">Câu 4: Điểm mạnh - Cẩn thận Zero Bug (自己PR)</option>
        <option value="c5">Câu 5: Điểm yếu - Hay lo lắng (短所)</option>
        <option value="c6">Câu 6: Làm việc nhóm - Horenso (チームワーク)</option>
        <option value="c8">Câu 8: Xử lý lỗi khó (課題解決)</option>
        <option value="c9">Câu 9: Khi bị nhắc nhở - Cầu tiến (素直さ)</option>
        <option value="c10">Câu 10: Tăng ca & Cuộc sống Nhật (日本生活・残業)</option>
      </optgroup>
      <optgroup label="🔴 PHẦN RIÊNG TỪNG CÔNG TY (CÂU ĐƠN PREP)">
        <option value="technolabo">🏢 TechnoLabo: 4 Câu hỏi & Trả lời (Xe hơi & Test)</option>
        <option value="hdk">🏭 Hokkaido Denshikiki: 4 Câu hỏi & Trả lời (Hạ tầng & C/C++)</option>
        <option value="ryuken">💻 Ryuken: 4 Câu hỏi & Trả lời (Goushou & Java)</option>
      </optgroup>
    </select>

    <button class="play-all-btn" id="play-all-btn" onclick="playAllCurrent()">
      ▶ Nghe Toàn Bộ Phần Này
    </button>

    <div class="sentence-list" id="sentence-container"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SECTIONS = {
      c1: [
        { tag: "tag-prep-p", tagText: "BẮT ĐẦU", ja: "はじめまして。", romaji: "Hajimemashite.", vi: "Rất vui được gặp thầy/cô." },
        { tag: "tag-prep-p", tagText: "HỌ TÊN", ja: "チャン・ティ・ゴック・ハと申します。", romaji: "Chan Ti Gokku Ha to moushimasu.", vi: "Em tên là Trần Thị Ngọc Hà." },
        { tag: "tag-prep-p", tagText: "TÊN GỌI", ja: "ハと呼んでください。", romaji: "Ha to yonde kudasai.", vi: "Xin hãy gọi em là Hà." },
        { tag: "tag-prep-r", tagText: "Ý NGHĨA", ja: "名前の「ハ」は、ベトナム語で「川」という意味です。", romaji: "Namae no「Ha」wa, Betonamu-go de「kawa」to iu imi desu.", vi: "Tên 'Hà' trong tiếng Việt có nghĩa là con sông." },
        { tag: "tag-prep-e", tagText: "TRƯỜNG HỌC", ja: "VKU大学の4年生です。", romaji: "VKU daigaku no yo-nensei desu.", vi: "Em là sinh viên năm 4 trường VKU." },
        { tag: "tag-prep-e", tagText: "CHUYÊN NGÀNH", ja: "専門はコンピュータサイエンスです。", romaji: "Senmon wa konpyuuta saiensu desu.", vi: "Chuyên ngành là Khoa học máy tính." },
        { tag: "tag-prep-e", tagText: "NGÔN NGỮ", ja: "得意なプログラミング言語は、Java と C/C++ です。", romaji: "Tokui na puroguramingu gengo wa, Java to C/C++ desu.", vi: "Ngôn ngữ lập trình sở trường là Java và C/C++." },
        { tag: "tag-prep-e", tagText: "THỰC TẬP", ja: "Napa Global と Safebelievers でインターンをしました。", romaji: "Napa Global to Safebelievers de intaan wo shimashita.", vi: "Em đã thực tập ở Napa Global và Safebelievers." },
        { tag: "tag-prep-e", tagText: "SẢN PHẨM", ja: "アプリとウェブを作りました。", romaji: "Apuri to webu wo tsukurimashita.", vi: "Em đã làm app và web." },
        { tag: "tag-prep-e", tagText: "SỞ THÍCH", ja: "趣味は、GitHubで新しい技術を見ることです。", romaji: "Shumi wa, GitHub de atarashii gijutsu wo miru koto desu.", vi: "Sở thích là tìm hiểu công nghệ mới trên GitHub." },
        { tag: "tag-prep-p", tagText: "KẾT THÚC", ja: "本日はどうぞよろしくお願いいたします。", romaji: "Honjitsu wa douzo yoroshiku onegai itashimasu.", vi: "Hôm nay em rất mong nhận được sự giúp đỡ của thầy/cô." }
      ],
      c3: [
        { tag: "tag-prep-p", tagText: "[P] Ý CHÍNH", ja: "得意な言語は、Java と C/C++ です。", romaji: "Tokui na gengo wa, Java to C/C++ desu.", vi: "[P] Ngôn ngữ em giỏi nhất là Java và C/C++." },
        { tag: "tag-prep-r", tagText: "[R] LÝ DO", ja: "大学とインターンで、一番多く使いました。", romaji: "Daigaku to intaan de, ichiban ooku tsukaimashita.", vi: "[R] Ở đại học và thực tập, em dùng nhiều nhất." },
        { tag: "tag-prep-e", tagText: "[E] DỰ ÁN", ja: "大学で「Smart AI Calculator」を作りました。", romaji: "Daigaku de「Smart AI Calculator」wo tsukurimashita.", vi: "[E] Ở trường đại học em đã làm Smart AI Calculator." },
        { tag: "tag-prep-e", tagText: "[E] 119 TEST", ja: "自分で 119件の単体テスト（Unit Test）を書きました。", romaji: "Jibun de hyaku-juukyuu-ken no tantai tesuto wo kakimashita.", vi: "[E] Tự em đã viết 119 bài Unit Test." },
        { tag: "tag-prep-e", tagText: "[E] ĐẠT 100%", ja: "全部合格しました。", romaji: "Zenbu goukaku shimashita.", vi: "[E] Toàn bộ đều đạt 100%." },
        { tag: "tag-prep-e", tagText: "[E] KHÔNG BUG", ja: "バグは発生しませんでした。", romaji: "Bagu wa hassei shimasen deshita.", vi: "[E] Không hề phát sinh bug (lỗi)." },
        { tag: "tag-prep-p", tagText: "[P] KHẲNG ĐỊNH", ja: "テストの仕事に自信があります。", romaji: "Tesuto no shigoto ni jishin ga arimasu.", vi: "[P] Em rất tự tin vào công việc kiểm thử." }
      ],
      c4: [
        { tag: "tag-prep-p", tagText: "[P] Ý CHÍNH", ja: "私の強みは、「バグを出さない、丁寧な開発」です。", romaji: "Watashi no tsuyomi wa,「bagu wo dasanai, teinei na kaihatsu」desu.", vi: "[P] Điểm mạnh của em là: Phát triển cẩn thận, không để xảy ra bug." },
        { tag: "tag-prep-r", tagText: "[R] QUAN NIỆM", ja: "プログラムは「動けば終わり」ではありません。", romaji: "Puroguramu wa「ugokeba owari」dewa arimasen.", vi: "[R] Lập trình không phải cứ chạy là xong việc." },
        { tag: "tag-prep-r", tagText: "[R] LÝ DO", ja: "使う人が安心して使えることが大切です。", romaji: "Tsukau hito ga anshin shite tsukaeru koto ga taisetsu desu.", vi: "[R] Người dùng an tâm sử dụng là điều quan trọng nhất." },
        { tag: "tag-prep-e", tagText: "[E] VÍ DỤ", ja: "Napa Global のインターンで、私はバックエンドを担当しました。", romaji: "Napa Global no intaan de, watashi wa bakkuendo wo tantou shimashita.", vi: "[E] Khi thực tập ở Napa Global, em làm Backend." },
        { tag: "tag-prep-e", tagText: "[E] SỰ CỐ", ja: "チームで、バグがたくさん発生しました。", romaji: "Chiimu de, bagu ga takusan hassei shimashita.", vi: "[E] Lúc đó trong nhóm đã phát sinh rất nhiều bug." },

        { tag: "tag-prep-e", tagText: "[E] KẾT QUẢ", ja: "だから、私の作った部分はバグが発生しませんでした。", romaji: "Dakara, watashi no tsukutta bubun wa bagu ga hassei shimasen deshita.", vi: "[E] Vì thế, phần do em làm không hề phát sinh bug." },
        { tag: "tag-prep-e", tagText: "[E] ĐÚNG HẠN", ja: "仕事も遅れませんでした。", romaji: "Shigoto mo okuremasen deshita.", vi: "[E] Tiến độ công việc cũng không bị trễ." },
        { tag: "tag-prep-p", tagText: "[P] KHẲNG ĐỊNH", ja: "貴社でも、丁寧に頑張りたいです。", romaji: "Kisha demo, teinei ni gambaritai desu.", vi: "[P] Vào quý công ty, em cũng muốn làm việc thật cẩn thận như vậy ạ." }
      ],
      c5: [
        { tag: "tag-prep-p", tagText: "[P] Ý CHÍNH", ja: "私の短所は、心配することです。", romaji: "Watashi no tansho wa, shinpai suru koto desu.", vi: "[P] Điểm yếu của em là: Hay lo lắng." },
        { tag: "tag-prep-r", tagText: "[R] NGUYÊN NHÂN", ja: "丁寧に作りたいです。", romaji: "Teinei ni tsukuritai desu.", vi: "[R] Em muốn làm cho thật cẩn thận." },
        { tag: "tag-prep-r", tagText: "[R] HẬU QUẢ", ja: "だから、たくさん考えます。", romaji: "Dakara, takusan kangaemasu.", vi: "[R] Vì thế, em suy nghĩ nhiều." },
        { tag: "tag-prep-e", tagText: "[E] TÌNH HUỐNG", ja: "インターンで、新しい仕事が心配でした。", romaji: "Intaan de, atarashii shigoto ga shinpai deshita.", vi: "[E] Khi thực tập, gặp việc mới em đã lo lắng." },
        { tag: "tag-prep-e", tagText: "[E] GHI CHÉP", ja: "ノートにメモを書きました。", romaji: "Nooto ni memo wo kakimashita.", vi: "[E] Em ghi chép cẩn thận vào sổ." },
        { tag: "tag-prep-e", tagText: "[E] HỎI TIỀN BỐI", ja: "先輩によく聞きました。", romaji: "Senpai ni yoku kikimashita.", vi: "[E] Em chủ động hỏi kỹ tiền bối." },
        { tag: "tag-prep-e", tagText: "[E] KẾT QUẢ", ja: "だから、バグは発生しませんでした。", romaji: "Dakara, bagu wa hassei shimasen deshita.", vi: "[E] Vì thế, không hề phát sinh bug nào." },

      c6: [

    let curSec = 'c1';
    const audioPlayer = new Audio();
    let voices = [];
    let jaVoice = null;

    function initVoices() {
      if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        jaVoice = voices.find(v => v.lang === 'ja-JP' || v.lang === 'ja_JP' || v.lang.startsWith('ja')) || null;
      }
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function cleanTextForSpeech(text) {
      return text.replace(/面接官：/g, '').replace(/[「」『』・]/g, ' ').trim();
    }

    function playAudio(text, onEnded) {
      const clean = cleanTextForSpeech(text);
      
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = 'ja-JP';
        u.rate = 0.85; // tốc độ chuẩn N5, chậm rãi, phát âm rõ
        u.pitch = 1.05;
        if (jaVoice) u.voice = jaVoice;
        
        let endedCalled = false;
        u.onend = () => {
          if (!endedCalled && onEnded) { endedCalled = true; onEnded(); }
        };
        u.onerror = () => {
          if (!endedCalled && onEnded) { endedCalled = true; onEnded(); }
        };
        window.speechSynthesis.speak(u);
        return;
      }

      const enc = encodeURIComponent(clean);
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&client=tw-ob&q=${enc}`;
      audioPlayer.src = url;
      audioPlayer.playbackRate = 0.9;
      audioPlayer.onended = onEnded || null;
      audioPlayer.onerror = onEnded || null;
      audioPlayer.play().catch(() => {
        if (onEnded) onEnded();
      });
    }

    function renderSentences() {
      const cont = document.getElementById('sentence-container');
      cont.innerHTML = '';
      const list = SECTIONS[curSec] || [];

      list.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `s-item ${item.isQ ? 'question-box' : ''}`;
        div.id = `s-item-${idx}`;
        div.onclick = () => {
          playSentence(idx);
        };

        div.innerHTML = `
          <div class="s-num">${idx + 1}</div>
          <div class="s-content">
            <span class="prep-tag ${item.tag}">${item.tagText}</span>
            <div class="s-ja">${item.ja}</div>
            <div class="s-romaji">${item.romaji}</div>
            <div class="s-vi">${item.vi}</div>
          </div>
        `;
        cont.appendChild(div);
      });
    }

    let playingIdx = -1;
    function playSentence(idx) {
      const list = SECTIONS[curSec] || [];
      if (!list[idx]) return;

      document.querySelectorAll('.s-item').forEach(el => el.classList.remove('playing'));
      const curEl = document.getElementById(`s-item-${idx}`);
      if (curEl) curEl.classList.add('playing');
      playingIdx = idx;

      playAudio(list[idx].ja, () => {
        if (curEl) curEl.classList.remove('playing');
        playingIdx = -1;
      });
    }

    let isPlayingAll = false;
    async function playAllCurrent() {
      const btn = document.getElementById('play-all-btn');
      if (isPlayingAll) {
        isPlayingAll = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        audioPlayer.pause();
        btn.innerText = '▶ Nghe Toàn Bộ Phần Này';
        document.querySelectorAll('.s-item').forEach(el => el.classList.remove('playing'));
        return;
      }

      isPlayingAll = true;
      btn.innerText = '⏹ Dừng Lại';
      const list = SECTIONS[curSec] || [];

      for (let i = 0; i < list.length; i++) {
        if (!isPlayingAll) break;
        document.querySelectorAll('.s-item').forEach(el => el.classList.remove('playing'));
        const curEl = document.getElementById(`s-item-${i}`);
        if (curEl) {
          curEl.classList.add('playing');
          curEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        await new Promise(resolve => {
          playAudio(list[i].ja, () => {
            setTimeout(resolve, 600); // nghỉ 0.6s giữa các câu đơn
          });
        });
      }

      isPlayingAll = false;
      btn.innerText = '▶ Nghe Toàn Bộ Phần Này';
      document.querySelectorAll('.s-item').forEach(el => el.classList.remove('playing'));
      showToast('Đã đọc xong phần này!');
    }

    function switchSection(secKey) {
      if (isPlayingAll) {
        isPlayingAll = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        audioPlayer.pause();
        document.getElementById('play-all-btn').innerText = '▶ Nghe Toàn Bộ Phần Này';
      }
      curSec = secKey;
      renderSentences();
    }

    // Khởi chạy ban đầu
    renderSentences();
  </script>
</body>
</html>
