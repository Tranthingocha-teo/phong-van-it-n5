<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Luyện Nói Phỏng Vấn N5 - Trần Thị Ngọc Hà</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #e0e7ff;
      --dark: #0f172a;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      background: var(--bg);
      color: var(--dark);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 580px;
      background: #fff;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 900;
      color: #1e1b4b;
      text-align: center;
      margin-bottom: 2px;
    }
    p.sub {
      font-size: 0.78rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 12px;
    }
    .select-box {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      font-size: 0.88rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .select-box:focus {
      border-color: #4f46e5;
      background: #fff;
    }
    .group-label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: #6366f1;
    }
    .play-all-btn {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #ec4899);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      margin-bottom: 14px;
      transition: transform 0.15s;
    }
    .play-all-btn:active { transform: scale(0.97); }
    .sentence-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sentence-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: all 0.2s;
    }
    .sentence-item.is-question {
      background: #f1f5f9;
      border-left: 4px solid #6366f1;
    }
    .sentence-item.speaking {
      border-color: #4f46e5;
      background: #eef2ff;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
    }
    .badge-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .tag-prep-p { background: #fee2e2; color: #991b1b; }
    .tag-prep-r { background: #fef3c7; color: #92400e; }
    .tag-prep-e { background: #dcfce7; color: #166534; }
    .tag-q { background: #e0e7ff; color: #3730a3; }
    .ja-text {
      font-size: 0.98rem;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.4;
    }
    .romaji-text {
      font-size: 0.75rem;
      color: #6366f1;
      font-weight: 600;
      margin-top: 2px;
    }
    .vi-text {
      font-size: 0.76rem;
      color: #64748b;
      margin-top: 1px;
    }
    .audio-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #4f46e5;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .audio-btn:active { transform: scale(0.9); background: #4f46e5; color: #fff; }
    .toast {
      position: fixed;
      bottom: 20px;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 99;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Luyện Nói Phỏng Vấn N5 Thực Chiến</h1>
    <p class="sub">Trần Thị Ngọc Hà • Chuẩn PREP • Câu Đơn N5 • 3 Công Ty Hokkaido</p>

    <div class="group-label">Chọn phần luyện tập:</div>
    <select class="select-box" id="sec-select" onchange="switchSection(this.value)">
      <optgroup label="🟢 PHẦN DÙNG CHUNG CẢ 3 CÔNG TY">
        <option value="c1">Câu 1: Giới thiệu bản thân (自己紹介)</option>
        <option value="c3">Câu 3: Kỹ năng & 119 Unit Tests (技術スキル)</option>
        <option value="c4">Câu 4: Điểm mạnh - Cẩn thận Zero Bug (自己PR)</option>
        <option value="c5">Câu 5: Điểm yếu - Hay lo lắng (短所)</option>
        <option value="c6">Câu 6: Làm việc nhóm - Horenso (チームワーク)</option>
        <option value="c8">Câu 8: Xử lý lỗi khó (課題解決)</option>
        <option value="c9">Câu 9: Khi bị nhắc nhở - Cầu tiến (素直さ)</option>
        <option value="c10">Câu 10: Tăng ca & Cuộc sống Nhật (日本生活・残業)</option>
      </optgroup>
      <optgroup label="🔴 PHẦN RIÊNG TỪNG CÔNG TY (PREP)">
        <option value="technolabo">🏢 TechnoLabo: 4 Câu hỏi & Trả lời PREP (Xe hơi & Test)</option>
        <option value="hdk">🏭 Hokkaido Denshikiki: 4 Câu hỏi & Trả lời PREP (Hạ tầng & C/C++)</option>
        <option value="ryuken">💻 Ryuken: 4 Câu hỏi & Trả lời PREP (Goushou & Java)</option>
      </optgroup>
    </select>

    <button class="play-all-btn" id="play-all-btn" onclick="playAllCurrent()">
      ▶ Nghe Toàn Bộ Phần Này
    </button>

    <div class="sentence-list" id="sentence-container"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SECTIONS = {
      c1: [
        { tag: "tag-prep-p", tagText: "BẮT ĐẦU", ja: "はじめまして。", romaji: "Hajimemashite.", vi: "Rất vui được gặp thầy/cô." },
        { tag: "tag-prep-p", tagText: "HỌ TÊN", ja: "チャン・ティ・ゴック・ハと申します。", romaji: "Chan Ti Gokku Ha to moushimasu.", vi: "Em tên là Trần Thị Ngọc Hà." },
        { tag: "tag-prep-p", tagText: "TÊN GỌI", ja: "ハと呼んでください。", romaji: "Ha to yonde kudasai.", vi: "Xin hãy gọi em là Hà." },
        { tag: "tag-prep-r", tagText: "Ý NGHĨA", ja: "名前の「ハ」は、ベトナム語で「川」という意味です。", romaji: "Namae no「Ha」wa, Betonamu-go de「kawa」to iu imi desu.", vi: "Tên 'Hà' trong tiếng Việt có nghĩa là con sông." },
        { tag: "tag-prep-e", tagText: "TRƯỜNG LỚP", ja: "VKU大学の4年生で、専門はコンピュータサイエンスです。", romaji: "VKU daigaku no yo-nensei de, senmon wa konpyuuta saiensu desu.", vi: "Em là sinh viên năm 4 trường VKU, chuyên ngành Khoa học Máy tính." },
        { tag: "tag-prep-e", tagText: "NGÔN NGỮ", ja: "得意な言語は、Java と C/C++ です。", romaji: "Tokui na gengo wa, Java to C/C++ desu.", vi: "Ngôn ngữ sở trường của em là Java và C/C++." },
        { tag: "tag-prep-e", tagText: "THỰC TẬP", ja: "Napa Global と Safebelievers でインターンを行い、アプリとウェブ開発を担当しました。", romaji: "Napa Global to Safebelievers de intaan wo okonai, apuri to webu kaihatsu wo tantou shimashita.", vi: "Em đã thực tập tại Napa Global và Safebelievers, phụ trách app và web." },
        { tag: "tag-prep-e", tagText: "SỞ THÍCH", ja: "趣味は、GitHubで新しい技術を調べることです。", romaji: "Shumi wa, GitHub de atarashii gijutsu wo shiraberu koto desu.", vi: "Sở thích của em là tìm hiểu công nghệ mới trên GitHub." },
        { tag: "tag-prep-p", tagText: "KẾT THÚC", ja: "本日はどうぞよろしくお願いいたします。", romaji: "Honjitsu wa douzo yoroshiku onegai itashimasu.", vi: "Hôm nay em rất mong nhận được sự giúp đỡ của thầy/cô." }
      ],
      c3: [
        { tag: "tag-prep-p", tagText: "[P] Ý CHÍNH", ja: "得意なプログラミング言語は、Java と C/C++ です。", romaji: "Tokui na puroguramingu gengo wa, Java to C/C++ desu.", vi: "[P] Ngôn ngữ em giỏi nhất là Java và C/C++." },
        { tag: "tag-prep-r", tagText: "[R] LÝ DO", ja: "大学とインターンシップで、一番多く使いましたから。", romaji: "Daigaku to intaanshippu de, ichiban ooku tsukaimashita kara.", vi: "[R] Vì ở đại học và thực tập, em đã sử dụng nhiều nhất." },
        { tag: "tag-prep-e", tagText: "[E] DỰ ÁN", ja: "大学では「Smart AI Calculator」を作りました。", romaji: "Daigaku dewa「Smart AI Calculator」wo tsukurimashita.", vi: "[E] Ở trường đại học em đã làm ứng dụng Smart AI Calculator." },
        { tag: "tag-prep-e", tagText: "[E] 119 TEST", ja: "自分で 119件の単体テスト（Unit Test）を書きました。", romaji: "Jibun de hyaku-juukyuu-ken no tantai tesuto (Unit Test) wo kakimashita.", vi: "[E] Tự em đã viết 119 bài kiểm thử đơn vị Unit Test." },
        { tag: "tag-prep-e", tagText: "[E] ZERO BUG", ja: "全部合格させました。エラーはありませんでした。", romaji: "Zenbu goukaku sasemashita. Eraa wa arimasen deshita.", vi: "[E] Toàn bộ đã đậu 100%, không hề có lỗi nào." },
        { tag: "tag-prep-p", tagText: "[P] KHẲNG ĐỊNH", ja: "このように、テストをしっかり行う開発に自信があります。", romaji: "Kono you ni, tesuto wo shikkari okonau kaihatsu ni jishin ga arimasu.", vi: "[P] Nhờ vậy, em rất tự tin vào việc phát triển kết hợp kiểm thử kỹ lưỡng." }
      ],
      c4: [
        { tag: "tag-prep-p", tagText: "[P] Ý CHÍNH", ja: "私の強みは、「バグを出さない、丁寧な開発」です。", romaji: "Watashi no tsuyomi wa,「bagu wo dasanai, teinei na kaihatsu」desu.", vi: "[P] Điểm mạnh của em là: Phát triển cẩn thận, không để có lỗi." },
        { tag: "tag-prep-r", tagText: "[R] LÝ DO 1", ja: "プログラムは「動けば終わり」ではありません。", romaji: "Puroguramu wa「ugokeba owari」dewa arimasen.", vi: "[R] Lập trình không phải cứ chạy là xong việc." },
        { tag: "tag-prep-r", tagText: "[R] LÝ DO 2", ja: "使う人が安心して使えることが大切です。", romaji: "Tsukau hito ga anshin shite tsukaeru koto ga taisetsu desu.", vi: "[R] Quan trọng nhất là người dùng có thể an tâm sử dụng." },
        { tag: "tag-prep-e", tagText: "[E] VÍ DỤ", ja: "Napa Global のインターンで、私はバックエンドを担当しました。", romaji: "Napa Global no intaan de, watashi wa bakkuendo wo tantou shimashita.", vi: "[E] Khi thực tập ở Napa Global, em phụ trách phần Backend." },
        { tag: "tag-prep-e", tagText: "[E] SỰ CỐ", ja: "チームで、エラーがたくさん出ました。", romaji: "Chiimu de, eraa ga takusan demashita.", vi: "[E] Lúc đó trong nhóm xảy ra rất nhiều lỗi." },
        { tag: "tag-prep-e", tagText: "[E] HÀNH ĐỘNG", ja: "でも、私は丁寧にテストをしました。", romaji: "Demo, watashi wa teinei ni tesuto wo shimashita.", vi: "[E] Nhưng em đã test rất cẩn thận." },
        { tag: "tag-prep-e", tagText: "[E] KẾT QUẢ", ja: "だから、私の作った部分はエラーがありませんでした。", romaji: "Dakara, watashi no tsukutta bubun wa eraa ga arimasen deshita.", vi: "[E] Vì thế phần do em làm không hề có lỗi nào cả." },
        { tag: "tag-prep-e", tagText: "[E] ĐÚNG HẠN", ja: "仕事も遅れませんでした。", romaji: "Shigoto mo okuremasen deshita.", vi: "[E] Tiến độ cũng không bị trễ." },
        { tag: "tag-prep-p", tagText: "[P] KHẲNG ĐỊNH", ja: "貴社でも、丁寧に頑張りたいです。", romaji: "Kisha demo, teinei ni gambaritai desu.", vi: "[P] Vào công ty, em cũng muốn làm việc thật cẩn thận như vậy ạ." }
      ],
      c5: [
        { tag: "tag-prep-p", tagText: "[P] Ý CHÍNH", ja: "私の短所は、心配することです。", romaji: "Watashi no tansho wa, shinpai suru koto desu.", vi: "[P] Điểm yếu của em là: Hay lo lắng." },
        { tag: "tag-prep-r", tagText: "[R] LÝ DO", ja: "丁寧に作りたいですから、たくさん考えます。", romaji: "Teinei ni tsukuritai desu kara, takusan kangaemasu.", vi: "[R] Vì muốn làm cho thật cẩn thận, nên em suy nghĩ nhiều." },
        { tag: "tag-prep-e", tagText: "[E] THỰC TẾ", ja: "Napa Global のインターンで、新しい仕事が心配でした。", romaji: "Napa Global no intaan de, atarashii shigoto ga shinpai deshita.", vi: "[E] Lúc thực tập ở Napa Global, khi gặp việc mới em đã rất lo." },
        { tag: "tag-prep-e", tagText: "[E] GIẢI PHÁP", ja: "でも、ノートにメモを書いて、先輩に聞きました。", romaji: "Demo, nooto ni memo wo kaite, senpai ni kikimashita.", vi: "[E] Nhưng em đã viết ghi chép vào sổ và hỏi tiền bối." },
        { tag: "tag-prep-e", tagText: "[E] KẾT QUẢ", ja: "だから、エラーはありませんでした。", romaji: "Dakara, eraa wa arimasen deshita.", vi: "[E] Vì thế công việc không hề có lỗi nào cả." },
        { tag: "tag-prep-p", tagText: "[P] KHẲNG ĐỊNH", ja: "会社でも、よく確認して、丁寧に頑張ります。", romaji: "Kaisha demo, yoku kakunin shite, teinei ni gambarimasu.", vi: "[P] Vào công ty, em cũng sẽ luôn kiểm tra kỹ và làm việc thật cẩn thận ạ." }
      ],
      c6: [
        { tag: "tag-prep-p", tagText: "[P] Ý CHÍNH", ja: "「勝手に決めないで、先輩によく聞くこと」です。", romaji: "「Katte ni kimenaide, senpai ni yoku kiku koto」desu.", vi: "[P] Điều em coi trọng nhất là: Không tự ý quyết định, luôn hỏi ý kiến tiền bối." },
        { tag: "tag-prep-r", tagText: "[R] LÝ DO", ja: "一人で決めると、ミスが出やすいですから。", romaji: "Hitori de kimeru to, misu ga deyasui desu kara.", vi: "[R] Vì nếu tự mình quyết định một mình thì rất dễ phát sinh lỗi." },
        { tag: "tag-prep-e", tagText: "[E] THỰC TẬP", ja: "インターンの時、分からないことはすぐ先輩に聞きました。", romaji: "Intaan no toki, wakaranai koto wa sugu senpai ni kikimashita.", vi: "[E] Khi thực tập, chuyện chưa hiểu em lập tức hỏi tiền bối ngay." },
        { tag: "tag-prep-e", tagText: "[E] KỶ LUẬT", ja: "ノートにメモを書きました。チームのルールを守りました。", romaji: "Nooto ni memo wo kakimashita. Chiimu no ruuru wo mamorimashita.", vi: "[E] Em ghi chép cẩn thận vào sổ và tuân thủ quy tắc của đội nhóm." },
        { tag: "tag-prep-p", tagText: "[P] KẾT QUẢ", ja: "だから、みんなと笑顔で、仲良く仕事ができました。", romaji: "Dakara, minna to egao de, nakayoku shigoto ga dekimashita.", vi: "[P] Nhờ đó, em luôn vui vẻ và hợp tác làm việc hòa đồng với mọi người." }
      ],
      c8: [
        { tag: "tag-prep-p", tagText: "[P] Ý CHÍNH", ja: "私は「あせらないで、一つずつ調べること」を大切にします。", romaji: "Watashi wa「aseranaide, hitotsu-zutsu shiraberu koto」wo taisetsu ni shimasu.", vi: "[P] Em coi trọng việc: Không nóng vội, kiên nhẫn tra cứu từng bước một." },
        { tag: "tag-prep-r", tagText: "[R] LÝ DO", ja: "あせると、もっとエラーが出ますから。", romaji: "Aseru to, motto eraa ga demasu kara.", vi: "[R] Vì nếu hoảng loạn sẽ càng dễ gây thêm lỗi." },
        { tag: "tag-prep-e", tagText: "[E] LOG", ja: "インターンで難しいエラーが出た時、ログをよく見ました。", romaji: "Intaan de muzukashii eraa ga deta toki, rogu wo yoku mimashita.", vi: "[E] Khi gặp lỗi hóc búa, em xem xét kỹ file log." },
        { tag: "tag-prep-e", tagText: "[E] TÀI LIỆU", ja: "そして、公式ドキュメントを丁寧に読みました。", romaji: "Soshite, koushiki dokyumento wo teinei ni yomimashita.", vi: "[E] Đọc kỹ tài liệu hướng dẫn chính thức." },
        { tag: "tag-prep-e", tagText: "[E] TIỀN BỐI", ja: "先輩にもアドバイスをもらいました。", romaji: "Senpai ni mo adobaisu wo moraimashita.", vi: "[E] Đồng thời xin lời khuyên từ tiền bối." },
        { tag: "tag-prep-p", tagText: "[P] KẾT QUẢ", ja: "その結果、問題を正しく解決できました。", romaji: "Sono kekka, mondai wo tadashiku kaiketsu dekimashita.", vi: "[P] Kết quả là em đã giải quyết triệt để vấn đề." }
      ],
      c9: [
        { tag: "tag-prep-p", tagText: "[P] Ý CHÍNH", ja: "「すぐに謝って、素直に直すこと」です。", romaji: "「Sugu ni ayamatte, sunao ni naosu koto」desu.", vi: "[P] Điều quan trọng là: Lập tức xin lỗi và thật thà sửa chữa." },
        { tag: "tag-prep-r", tagText: "[R] LÝ DO", ja: "誰でもミスはあります。隠さないことが大切です。", romaji: "Dare demo misu wa arimasu. Kakusanai koto ga taisetsu desu.", vi: "[R] Ai cũng có lúc mắc lỗi. Quan trọng nhất là tuyệt đối không giấu lỗi." },
        { tag: "tag-prep-e", tagText: "[E] TIẾP THU", ja: "先輩に注意された時は、「ありがとうございます」と言って、すぐメモに書きます。", romaji: "Senpai ni chuui sareta toki wa,「arigatou gozaimasu」to itte, sugu memo ni kakimasu.", vi: "[E] Khi được tiền bối nhắc nhở, em nói cảm ơn và ghi ngay vào sổ." },
        { tag: "tag-prep-e", tagText: "[E] HÀNH ĐỘNG", ja: "そして、同じミスを二度としません。", romaji: "Soshite, onaji misu wo nido to shimasen.", vi: "[E] Và nhất định không bao giờ lặp lại lỗi đó lần thứ hai." },
        { tag: "tag-prep-p", tagText: "[P] KHẲNG ĐỊNH", ja: "この素直な気持ちを、仕事でも大切にします。", romaji: "Kono sunao na kimochi wo, shigoto demo taisetsu ni shimasu.", vi: "[P] Em sẽ luôn giữ thái độ cầu tiến, thật thà này trong công việc." }
      ],
      c10: [
        { tag: "tag-prep-p", tagText: "[P] Ý CHÍNH", ja: "日本で働くことについて、心配はありません。", romaji: "Nihon de hataraku koto ni tsuite, shinpai wa arimasen.", vi: "[P] Về việc sinh hoạt và làm việc tại Nhật, em không có gì lo lắng cả." },

      technolabo: [
        { isQ: true, tag: "tag-q", tagText: "CÂU HỎI 1", ja: "面接官：なぜ当社（テクノラボ）を志望しましたか？", romaji: "Naze tousha (TechnoLabo) wo shibou shimashita ka?", vi: "Người hỏi: Tại sao bạn ứng tuyển vào TechnoLabo?" },

        { tag: "tag-prep-r", tagText: "[R] LÝ DO", ja: "大学とインターンで、JavaとWebの基本を一番多く勉強しましたから。", romaji: "Daigaku to intaan de, Java to Web no kihon wo ichiban ooku benkyou shimashita kara.", vi: "[R] Vì ở đại học và thực tập, Java và Web là nền tảng em học nhiều nhất." },
        { tag: "tag-prep-e", tagText: "[E] HÀNH ĐỘNG", ja: "使う人が困らないように、データベースやエラーの処理を丁寧に作ります。", romaji: "Tsukau hito ga komaranai you ni, deetabeesu ya eraa no shori wo teinei ni tsukurimasu.", vi: "[E] Để người dùng không gặp sự cố, em sẽ xây database và xử lý lỗi thật cẩn thận." },
        { tag: "tag-prep-p", tagText: "[P] MỤC TIÊU", ja: "「Ha さんに任せれば安心だ」とお客様にも信頼されるSEになりたいです。", romaji: "「Ha-san ni makasereba anshin da」to okyaku-sama ni mo shinrai sareru SE ni naritai desu.", vi: "[P] Em muốn trở thành kỹ sư phần mềm được khách hàng tin cậy nói 'Giao cho Hà thì yên tâm'." },

        { isQ: true, tag: "tag-q", tagText: "CÂU HỎI 4", ja: "面接官：何か質問がありますか？", romaji: "Nanika shitsumon ga arimasu ka?", vi: "Người hỏi: Bạn có câu hỏi nào muốn hỏi chúng tôi không?" },
        { tag: "tag-prep-p", tagText: "XIN PHÉP", ja: "はい、1つ質問させてください。", romaji: "Hai, hitotsu shitsumon sasete kudasai.", vi: "Dạ vâng, xin cho phép em được hỏi 1 câu ạ." },
        { tag: "tag-prep-e", tagText: "CÂU HỎI NGƯỢC", ja: "お客様に長く喜ばれる業務システムを作るために、プログラマーとして一番大切なことは何でしょうか？", romaji: "Okyaku-sama ni nagaku yorokobareru gyoumu shisutemu wo tsukuru tame ni, puroguramaa to shite ichiban taisetsu na koto wa nan deshō ka?", vi: "Để làm hệ thống khiến khách hàng hài lòng bền lâu, điều quan trọng nhất của lập trình viên là gì ạ?" }
      ]
    };

    let curSec = 'c1';
    const audioPlayer = new Audio();
    let voices = [];
    let jaVoice = null;

    function initVoices() {
      if ('speechSynthesis' in window) {
        voices = window.speechSynthesis.getVoices();
        jaVoice = voices.find(v => v.lang === 'ja-JP' || v.lang === 'ja_JP' || v.lang.startsWith('ja')) || null;
      }
    }
    if ('speechSynthesis' in window) {
      initVoices();
      window.speechSynthesis.onvoiceschanged = initVoices;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function speakText(text, onEnd = null) {
      showToast("🔊 Đang đọc: " + text.slice(0, 25));
      try {
        const clean = text.replace(/[\n\r]/g, ' ').replace(/^面接官：/, '').trim();
        const url = "https://translate.google.com/translate_tts?ie=UTF-8&tl=ja&client=tw-ob&q=" + encodeURIComponent(clean);
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        audioPlayer.onended = () => { if (onEnd) onEnd(); };
        audioPlayer.onerror = () => fallbackSpeech(clean, onEnd);
        audioPlayer.src = url;
        audioPlayer.play().catch(() => fallbackSpeech(clean, onEnd));
      } catch (e) {
        fallbackSpeech(text, onEnd);
      }
    }

    function fallbackSpeech(text, onEnd = null) {
      if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
        if (onEnd) onEnd();
        return;
      }
      try {
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
        const clean = text.replace(/^面接官：/, '');
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = 'ja-JP';
        u.rate = 0.95;
        if (!jaVoice) initVoices();
        if (jaVoice) u.voice = jaVoice;
        u.onend = () => { if (onEnd) onEnd(); };
        u.onerror = () => { if (onEnd) onEnd(); };
        window.speechSynthesis.speak(u);
      } catch (e) {
        if (onEnd) onEnd();
      }
    }

    function switchSection(secKey) {
      curSec = secKey;
      document.getElementById('sec-select').value = secKey;
      renderList();
    }

    function renderList() {
      const list = SECTIONS[curSec] || [];
      const c = document.getElementById('sentence-container');
      c.innerHTML = list.map((item, idx) => `
        <div class="sentence-item ${item.isQ ? 'is-question' : ''}" id="item-${idx}">
          <div>
            ${item.tag ? `<span class="badge-tag ${item.tag}">${item.tagText}</span>` : ''}
            <div class="ja-text">${item.ja}</div>
            <div class="romaji-text">${item.romaji}</div>
            <div class="vi-text">${item.vi}</div>
          </div>
          <button class="audio-btn" onclick="playSingleSentence(${idx})">🔊</button>
        </div>
      `).join('');
    }

    function playSingleSentence(idx) {
      document.querySelectorAll('.sentence-item').forEach(el => el.classList.remove('speaking'));
      const itemEl = document.getElementById('item-' + idx);
      if (itemEl) itemEl.classList.add('speaking');
      speakText(SECTIONS[curSec][idx].ja, () => {
        if (itemEl) itemEl.classList.remove('speaking');
      });
    }

    function playAllCurrent(idx = 0) {
      const list = SECTIONS[curSec] || [];
      if (idx >= list.length) {
        document.querySelectorAll('.sentence-item').forEach(el => el.classList.remove('speaking'));
        showToast("✅ Đã đọc xong phần này!");
        return;
      }
      document.querySelectorAll('.sentence-item').forEach(el => el.classList.remove('speaking'));
      const itemEl = document.getElementById('item-' + idx);
      if (itemEl) itemEl.classList.add('speaking');
      speakText(list[idx].ja, () => {
        setTimeout(() => playAllCurrent(idx + 1), 380);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderList();
    });
  </script>
</body>
</html>
